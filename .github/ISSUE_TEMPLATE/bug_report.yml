name: "🐛 Bug report"
description: Create a report to help us fix a problem
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        **Note:** Questions belong in [Discussions](https://github.com/officialminx/ha-bkw-dynamic-tariffs/discussions).
  - type: textarea
    id: current-behavior
    attributes:
      label: The problem
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: integration-mode
    attributes:
      label: Integration mode
      options:
        - Demo mode
        - API mode
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: v0.0.1
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: "2025.1.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Enable debug logging first, reproduce the problem, then paste logs.
        ```yaml
        logger:
          logs:
            custom_components.bkw_dynamic_tariffs: debug
        ```
      render: shell
  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Configuration details (redact your API key!), screenshots, diagnostics.
